spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    properties:
      hibernate:
        show_sql: false
  flyway:
    enabled: true
    clean-disabled: true

logging:
  level:
    com.errolito.mycrud: INFO