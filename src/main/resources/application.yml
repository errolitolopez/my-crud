spring:
  application:
    name: simple-crud
  profiles:
    active: ${PROFILE:dev}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            temperature: 1
            thinking-level: minimal
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftl
    cache: false
  web:
    resources:
      add-mappings: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    java:
      enabled: true
    build:
      enabled: true

aws:
  region: ap-southeast-2
  s3:
    bucket-name: amzn-s3-my-crud-bucket