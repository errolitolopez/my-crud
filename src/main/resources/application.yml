spring:
  application:
    name: my-crud
  profiles:
    active: ${PROFILE:dev}

server:
  port: ${PORT:8080}

instance:
  port: ${INSTANCE_PORT}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    java:
      enabled: true
    build:
      enabled: true
  observations:
    annotations:
      enabled: true
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_URL:http://otel-collector:4318/v1/traces}
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_TRACES_URL:http://otel-collector:4318/v1/metrics}
        step: 5m