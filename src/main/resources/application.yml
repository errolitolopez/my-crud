spring:
  application:
    name: simple-crud
  profiles:
    active: ${PROFILE:dev}

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    java:
      enabled: true
    build:
      enabled: true

aws:
  region: ap-southeast-2
  s3:
    bucket-name: amzn-s3-my-crud-bucket