services:
  # 1. Postgres
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123qwe
      POSTGRES_DB: my_db
    ports:
      - "5432:5432"
    networks:
      - my-network

  # 2. Jenkins
  jenkins:
    image: jenkins/jenkins:latest
    container_name: jenkins
    restart: unless-stopped
    user: root
    privileged: true
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - my-network
    command: >
      bash -c "apt-get update &&
               apt-get install -y docker.io &&
               chmod 666 /var/run/docker.sock &&
               exec /usr/local/bin/jenkins.sh"

  # 3. Spring Boot App (Instance 1)
  my-crud-8091:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-crud:latest
    container_name: my-crud-8091
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      INSTANCE_PORT: 8091
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/my_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123qwe
    depends_on:
      - postgres
    networks:
      - my-network

  # 4. Spring Boot App (Instance 2)
  my-crud-8092:
    image: my-crud:latest
    container_name: my-crud-8092
    restart: unless-stopped
    ports:
      - "8092:8080"
    environment:
      INSTANCE_PORT: 8092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/my_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123qwe
    depends_on:
      - postgres
    networks:
      - my-network

  # 5. NGINX
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - my-crud-8091
      - my-crud-8092
    networks:
      - my-network

volumes:
  jenkins_home:

networks:
  my-network:
    driver: bridge