global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-apps'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'my-crud:8080'
          - 'my-crud-1:8080'
          - 'my-crud-2:8080'

  - job_name: 'otel-collector'
    static_configs:
      - targets:
          - 'otel-collector:4317'