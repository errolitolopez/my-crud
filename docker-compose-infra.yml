name: my-crud-infra-stack

# 1. Build & run
# docker compose -f docker-compose-infra.yml up -d

services:
  postgres:
    container_name: postgres
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123qwe
      POSTGRES_DB: my_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my-network

  nginx:
    container_name: nginx
    image: nginx:1.29.7
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - my-network

volumes:
  postgres_data:

networks:
  my-network:
    name: my-network